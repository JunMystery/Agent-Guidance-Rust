name: Tag & Release Trigger

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      prune_older_tags:
        description: 'Delete older tags and releases from remote'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag-and-trigger:
    name: Auto-Tag and Trigger Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Cargo Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/' | tr -d '[:space:]')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected project version: ${VERSION} (${TAG})"

      - name: Check and Create Git Tag
        id: create_tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prune Older Tags and Releases (Optional)
        if: github.event.inputs.prune_older_tags == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ steps.get_version.outputs.tag }}"
          echo "Preserving current tag: ${CURRENT_TAG}"
          for tag in $(git tag -l); do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Pruning older release/tag: $tag"
              gh release delete "$tag" -y --cleanup-tag || git push origin --delete "$tag" || true
            fi
          done
