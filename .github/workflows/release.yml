name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build (e.g. v1.5.9)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: agent-guidance-linux-x86_64.tar.gz
            asset_path: agent-guidance-linux-x86_64.tar.gz
            binary_name: agent-guidance
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: agent-guidance-windows-x86_64.zip
            asset_path: agent-guidance-windows-x86_64.zip
            binary_name: agent-guidance.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: agent-guidance-macos-aarch64.tar.gz
            asset_path: agent-guidance-macos-aarch64.tar.gz
            binary_name: agent-guidance
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: agent-guidance-macos-x86_64.tar.gz
            asset_path: agent-guidance-macos-x86_64.tar.gz
            binary_name: agent-guidance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Sign binary & verify provenance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\sign-binary.ps1 -Target "target\${{ matrix.target }}\release\${{ matrix.binary_name }}"
          & "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" --fingerprint

      - name: Sign binary & verify provenance (Unix)
        if: runner.os != 'Windows'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          chmod +x scripts/sign-binary.sh
          bash scripts/sign-binary.sh "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] || [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            chmod +x "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
            ./target/${{ matrix.target }}/release/${{ matrix.binary_name }} --fingerprint || true
          fi

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          FILES_TO_PACK="${{ matrix.binary_name }}"
          if [ -f "${{ matrix.binary_name }}.sig" ]; then
            FILES_TO_PACK="$FILES_TO_PACK ${{ matrix.binary_name }}.sig"
          fi
          tar -czvf ../../../${{ matrix.artifact_name }} $FILES_TO_PACK
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}" -Force
          $hash = (Get-FileHash -Path "${{ matrix.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -FilePath "${{ matrix.artifact_name }}.sha256" -Encoding ascii

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' || inputs.tag_name != ''
        with:
          tag_name: ${{ inputs.release_tag || inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_tag || inputs.tag_name || github.ref_name }}
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
