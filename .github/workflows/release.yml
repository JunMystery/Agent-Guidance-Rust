name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: agent-guidance-x86_64-pc-windows-msvc.exe
            binary_name: agent-guidance.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: agent-guidance-x86_64-unknown-linux-gnu
            binary_name: agent-guidance
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: agent-guidance-aarch64-apple-darwin
            binary_name: agent-guidance
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: agent-guidance-x86_64-apple-darwin
            binary_name: agent-guidance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}.exe" "${{ matrix.artifact_name }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.artifact_name }}"
            chmod +x "${{ matrix.artifact_name }}"
          fi

      - name: Upload Binary Asset to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
