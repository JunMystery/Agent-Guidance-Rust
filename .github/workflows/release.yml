name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: agent-guidance-linux-x86_64.tar.gz
            asset_path: agent-guidance-linux-x86_64.tar.gz
            binary_name: agent-guidance
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: agent-guidance-windows-x86_64.zip
            asset_path: agent-guidance-windows-x86_64.zip
            binary_name: agent-guidance.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: agent-guidance-macos-aarch64.tar.gz
            asset_path: agent-guidance-macos-aarch64.tar.gz
            binary_name: agent-guidance
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: agent-guidance-macos-x86_64.tar.gz
            asset_path: agent-guidance-macos-x86_64.tar.gz
            binary_name: agent-guidance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}" -Force

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
