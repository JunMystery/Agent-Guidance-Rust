name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build for
        required: true
        default: v1.1.5

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: agent-guidance
            asset: agent-guidance-x86_64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-13
            binary: agent-guidance
            asset: agent-guidance-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: agent-guidance
            asset: agent-guidance-aarch64-apple-darwin
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            binary: agent-guidance.exe
            asset: agent-guidance-x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Windows cross toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
