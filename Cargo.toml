[package]
name = "agent-guidance"
version = "1.5.8"
edition = "2024"
authors = ["Jun Mystery <contact@junmystery.com>"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
ignore = "0.4"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
rust-embed = "8.4"
regex = "1.10"
dirs = "5.0"
tiny_http = "0.12"
toml = "0.8"
fs2 = "0.4"
sysinfo = "0.30"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["std", "load-dynamic"] }
ndarray = "0.15"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.10", default-features = false, features = ["ksni"] }
libdbus-sys = { version = "0.2", features = ["vendored"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-item = { version = "0.10", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[features]
default = []
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "ort/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
directml = ["ort/directml"]

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8", features = ["accelerate"] }
candle-nn = { version = "0.8", features = ["accelerate"] }

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
