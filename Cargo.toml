[package]
name = "agent-guidance"
version = "1.3.5"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
ignore = "0.4"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
tree-sitter = "0.22"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
rust-embed = "8.4"
regex = "1.10"
dirs = "5.0"
tiny_http = "0.12"
toml = "0.8"
fs2 = "0.4"
sysinfo = "0.30"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["std", "load-dynamic"] }
ndarray = "0.15"

[features]
default = []
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8", features = ["accelerate"] }
candle-nn = { version = "0.8", features = ["accelerate"] }

[[bench]]
name = "performance"
harness = false
